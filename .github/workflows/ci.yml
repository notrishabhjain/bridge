name: Sentinel AI Bridge CI

# Triggers: every push/PR to main or develop builds & tests the debug APK.
# A semver tag (v*) additionally produces a signed release APK and GitHub Release.
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NDK_VERSION: 26.1.10909125
  JAVA_VERSION: '17'
  # Android project lives one level below repo root
  PROJECT_DIR: sentinel-bridge-kiro/sentinel-kiro

# ---------------------------------------------------------------------------
# Job 1: Build debug APK + run all quality gates
# ---------------------------------------------------------------------------
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # All `run` steps execute from the Android project directory unless overridden.
    defaults:
      run:
        working-directory: sentinel-bridge-kiro/sentinel-kiro

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # llama.cpp is NOT a tracked submodule at repo root — clone it fresh.
      # Cache keyed on .gitmodules so the cache busts when the URL/pin changes.
      - name: Cache llama.cpp source
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/native/third_party/llama.cpp
          key: llama-cpp-src-${{ hashFiles(format('{0}/.gitmodules', env.PROJECT_DIR)) }}
          restore-keys: llama-cpp-src-

      - name: Clone llama.cpp (shallow, if not cached)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf native/third_party/llama.cpp
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git \
              native/third_party/llama.cpp

      # ── Toolchain ─────────────────────────────────────────────────────────
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle  # caches ~/.gradle/caches + ~/.gradle/wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26d (pinned)
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" 2>&1 \
            | grep -v '^\[=' | grep -v '^$' || true

      # ── Native (CMake) cache ───────────────────────────────────────────────
      # Key covers both CMakeLists files so any change triggers a rebuild.
      - name: Cache CMake build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/native/.cxx
            ${{ env.PROJECT_DIR }}/native/build
          key: ${{ runner.os }}-cmake-${{ hashFiles(
                 format('{0}/native/CMakeLists.txt', env.PROJECT_DIR),
                 format('{0}/native/third_party/llama.cpp/CMakeLists.txt', env.PROJECT_DIR)
               ) }}
          restore-keys: ${{ runner.os }}-cmake-

      # ── Native build ───────────────────────────────────────────────────────
      # Exact flags from .kiro/steering/ci-cd.md — do not relax any of them.
      - name: Build llama.cpp native library (arm64-v8a)
        run: |
          cmake -S native -B native/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_RPC=OFF \
            -DGGML_NEON=ON
          cmake --build native/build --parallel $(nproc)

      # ── Android build ──────────────────────────────────────────────────────
      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Tests ──────────────────────────────────────────────────────────────
      # Unit tests (JVM only — no emulator required).
      # --continue collects failures across all modules before reporting.
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --continue

      # ── Code quality ───────────────────────────────────────────────────────
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      # Detekt fails only on violations *beyond* the committed baseline.
      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-bridge-debug-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Test & Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            ${{ env.PROJECT_DIR }}/**/build/reports/tests/
            ${{ env.PROJECT_DIR }}/**/build/reports/detekt/
            ${{ env.PROJECT_DIR }}/**/build/reports/lint-results*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Signed release APK + GitHub Release (v* tags only)
  # ---------------------------------------------------------------------------
  release:
    name: Signed Release APK
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    # Required for creating a GitHub Release.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: sentinel-bridge-kiro/sentinel-kiro

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore llama.cpp source cache
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/native/third_party/llama.cpp
          key: llama-cpp-src-${{ hashFiles(format('{0}/.gitmodules', env.PROJECT_DIR)) }}
          restore-keys: llama-cpp-src-

      - name: Clone llama.cpp (shallow, if not cached)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf native/third_party/llama.cpp
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git \
              native/third_party/llama.cpp

      # ── Toolchain ─────────────────────────────────────────────────────────
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26d (pinned)
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" 2>&1 \
            | grep -v '^\[=' | grep -v '^$' || true

      # ── Native (CMake) ─────────────────────────────────────────────────────
      - name: Restore CMake build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/native/.cxx
            ${{ env.PROJECT_DIR }}/native/build
          key: ${{ runner.os }}-cmake-${{ hashFiles(
                 format('{0}/native/CMakeLists.txt', env.PROJECT_DIR),
                 format('{0}/native/third_party/llama.cpp/CMakeLists.txt', env.PROJECT_DIR)
               ) }}
          restore-keys: ${{ runner.os }}-cmake-

      - name: Build llama.cpp native library (arm64-v8a)
        run: |
          cmake -S native -B native/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_RPC=OFF \
            -DGGML_NEON=ON
          cmake --build native/build --parallel $(nproc)

      # ── Signing ────────────────────────────────────────────────────────────
      # Required secrets (set in GitHub → Settings → Secrets → Actions):
      #   KEYSTORE_BASE64   — base64 of release-keystore.jks
      #                       encode: base64 -w 0 release-keystore.jks (Linux)
      #                                base64 -i release-keystore.jks | pbcopy (macOS)
      #   KEYSTORE_PASSWORD — keystore password
      #   KEY_ALIAS         — signing key alias
      #   KEY_PASSWORD      — signing key password
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      # ── Release build ──────────────────────────────────────────────────────
      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Assemble signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            "-Pandroid.injected.signing.store.file=${{ github.workspace }}/${{ env.PROJECT_DIR }}/app/release-keystore.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sentinel AI Bridge ${{ steps.version.outputs.VERSION }}
          body: |
            ## Sentinel AI Bridge ${{ steps.version.outputs.VERSION }}

            ### Installation

            1. Download `app-release.apk` from the assets below
            2. Transfer to Redmi Turbo 5 (HyperOS 2.x)
            3. Enable **Install from unknown sources** in Settings → Privacy
            4. Install: `adb install app-release.apk`
            5. Launch **Sentinel Bridge** and follow the setup wizard

            ### Requirements

            - Xiaomi device running HyperOS 2.x
            - MacroDroid installed
            - ~2.5 GB free storage (Qwen3-4B GGUF model downloaded via setup wizard)

            ### MacroDroid Setup

            Trigger: `com.sentinel.bridge.START_PIPELINE`
            Result: `com.sentinel.bridge.PIPELINE_COMPLETE` / `PIPELINE_FAILED`

            See [README](https://github.com/${{ github.repository }}/blob/main/sentinel-bridge-kiro/sentinel-kiro/README.md) for full MacroDroid macro setup instructions.
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always clean up the keystore — even if an earlier step failed.
      - name: Remove keystore from workspace
        if: always()
        run: rm -f app/release-keystore.jks
